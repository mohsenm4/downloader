name: Release

# Push a tag like v1.2.0 to build the universal macOS app and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

      - name: Install fyne tool
        run: go install fyne.io/tools/cmd/fyne@v1.7.0

      - name: Build universal app
        run: make release VERSION="${GITHUB_REF_NAME#v}" BUILD="${GITHUB_RUN_NUMBER}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 \
            --title "Downloader $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
